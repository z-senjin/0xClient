// build.gradle -- the whole build, so "Run" in IntelliJ is the only step you need.
//
// Half of this project is C++ (the injected DLL) and half is Java (the plugins). Gradle drives both:
// it compiles the Java, shells out to CMake for the native side, writes the config file, and starts
// the launcher. You do not have to run CMake yourself.
//
//   gradlew run       build everything and start the launcher   <- the one you want
//   gradlew dist      build everything, don't start it
//   gradlew clean     throw it all away

plugins {
    id 'java'
}

repositories { mavenCentral() }

// The only external things in the build: lombok (build-time code generation for the ported plugin's
// @Getter boilerplate) and the test libraries for the ported plugin's own test suite. None of it
// reaches the jar except test classes, which never ship.
dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

// The Java lives in java/, not src/main/java. This project is small enough that the extra nesting
// bought nothing.
sourceSets.main.java.srcDirs = ['java']
sourceSets.main.resources.srcDirs = ['resources']
sourceSets.test.java.srcDirs = ['java-test']
sourceSets.test.resources.srcDirs = ['resources']

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// The sources are UTF-8. javac on JDK 17 still defaults to the platform charset -- cp1252 on an
// English Windows -- which quietly turns the "péché" literal in HubTest into mojibake and fails a test
// that passes on every Linux box (2026-09-05). JDK 18+ made UTF-8 the default; say it either way.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Everything the launcher needs ends up here, side by side: 0xClient.exe, 0xclient.dll,
// 0xclient.jar, 0xclient.ini. The DLL finds the jar by looking next to itself, so they must stay
// together -- this directory IS the shipping layout.
def distDir = layout.buildDirectory.dir('dist')
def nativeBuildDir = layout.buildDirectory.dir('native')

jar {
    archiveFileName = '0xclient.jar'
    destinationDirectory = distDir
}

// ---------------------------------------------------------------------------------------------------
// The native half. CMake is invoked as an ordinary process -- no Gradle C++ plugin, because it would
// need its own toolchain declarations for the same result.
// ---------------------------------------------------------------------------------------------------

/** The JDK Gradle itself is running on. CMake needs it to find jni.h, and it is the one JDK we KNOW exists. */
def gradleJdk = System.getProperty('java.home')

/**
 * Fail with a sentence somebody can act on, instead of the raw "cmake: command not found" or the
 * twenty-line CMake wall of text about no CXX compiler. These are the only two things this build needs
 * that a fresh machine will not already have.
 */
tasks.register('checkToolchain') {
    group = 'build'
    description = 'Check CMake and a C++ compiler are present before trying to use them.'

    doLast {
        def onPath = { String exe ->
            System.getenv('PATH').split(File.pathSeparator).any { dir ->
                ['', '.exe', '.bat', '.cmd'].any { new File(dir, exe + it).canExecute() }
            }
        }

        if (!onPath('cmake')) {
            throw new GradleException(
                    "\n\n  CMake is not installed (or not on your PATH).\n\n" +
                    "  Half of this project is C++ -- the DLL that gets injected into the game -- so\n" +
                    "  the build needs it. Get it from https://cmake.org/download/ and tick\n" +
                    "  \"Add CMake to the system PATH\" in the installer, then reopen your terminal\n" +
                    "  (or restart IntelliJ, which caches the PATH it was started with).\n")
        }

        // On Windows the compiler is the other half. MSVC is not on PATH outside a developer prompt,
        // so its absence here proves nothing -- only warn, and let CMake give the real verdict.
        if (!onPath('cl') && !onPath('g++') && !onPath('clang++')) {
            def vs = new File(System.getenv('ProgramFiles(x86)') ?: 'C:\\Program Files (x86)',
                    'Microsoft Visual Studio')
            def vs64 = new File(System.getenv('ProgramFiles') ?: 'C:\\Program Files',
                    'Microsoft Visual Studio')
            if (!vs.exists() && !vs64.exists()) {
                logger.warn(
                        "\n  WARNING: no C++ compiler found on PATH and no Visual Studio installed.\n" +
                        "  If the next step fails saying \"No CMAKE_CXX_COMPILER could be found\", install\n" +
                        "  \"Build Tools for Visual Studio\" (the Desktop development with C++ workload)\n" +
                        "  from https://visualstudio.microsoft.com/downloads/ -- you do not need the full IDE.\n")
            }
        }
    }
}

tasks.register('cmakeConfigure', Exec) {
    group = 'build'
    description = 'Generate the native build files.'
    dependsOn 'checkToolchain'
    outputs.dir nativeBuildDir

    doFirst {
        nativeBuildDir.get().asFile.mkdirs()
        // JAVA_HOME is how CMake's FindJNI locates jni.h. Passing the JDK Gradle is already using
        // means the headers always match the JVM that will actually load the DLL.
        environment 'JAVA_HOME', gradleJdk
    }

    // No -A x64: that flag only exists on the Visual Studio generators, and it hard-fails on mingw.
    // The 64-bit check lives in CMakeLists.txt instead, where it works for every generator.
    commandLine 'cmake',
            '-S', projectDir.absolutePath,
            '-B', nativeBuildDir.get().asFile.absolutePath,
            '-G', 'Visual Studio 18 2026',
            '-A', 'x64',
            "-DOXC_DIST=${distDir.get().asFile.absolutePath}"
}

tasks.register('cmakeBuild', Exec) {
    group = 'build'
    description = 'Compile 0xclient.dll and 0xClient.exe.'
    dependsOn 'cmakeConfigure'

    doFirst { environment 'JAVA_HOME', gradleJdk }

    // --config Release is ignored by single-config generators (mingw) and required by multi-config
    // ones (Visual Studio), so passing it always is correct for both.
    commandLine 'cmake', '--build', nativeBuildDir.get().asFile.absolutePath, '--config', 'Release'
}

// ---------------------------------------------------------------------------------------------------
// Config file
// ---------------------------------------------------------------------------------------------------

tasks.register('writeIni') {
    group = 'build'
    description = 'Put 0xclient.ini next to the DLL, pointed at this JDK.'

    doLast {
        def target = distDir.get().file('0xclient.ini').asFile
        target.parentFile.mkdirs()

        // Only ever written once. After that it is YOURS -- the woodcutter's tree and coordinates live
        // in here, and a build silently reverting them would be maddening.
        if (target.exists()) {
            logger.lifecycle("0xclient.ini already exists, leaving it alone")
            return
        }

        // java= is filled in from the JDK running this build, so there is no manual edit step. That
        // setting existed because the DLL loads jvm.dll at runtime and cannot guess where it is.
        //
        // quoteReplacement is NOT optional here. replaceFirst treats backslashes in the REPLACEMENT
        // string as escapes, so a plain Windows path goes in as C:\Users\me\jdk and comes out as
        // C:Usersmejdk -- every separator silently eaten. The client then cannot find jvm.dll and says
        // so, quoting a path that is visibly mangled but only if you look closely.
        String path = gradleJdk.replace('/', '\\')
        def text = file('0xclient.ini').text.replaceFirst(
                /(?m)^java=.*$/, 'java=' + java.util.regex.Matcher.quoteReplacement(path))

        // game= too, when a copy of the game can be found -- because this file is only ever written
        // once, and the ONE time it gets written again is right after somebody has deleted build/,
        // which is exactly when the hand-added game= line has just been lost as well.
        //
        // This happened for real on 2026-09-07: a clean rebuild removed build/ and took build/game/
        // with it, destroying the only local copy of client-240-6 -- the build offsets.hpp was
        // measured against -- along with the edited ini that pointed at it. Nothing in the tree
        // noticed, because build/ is by definition disposable and nobody had ever said the game must
        // not live there.
        def game = [file('game/osclient.exe'),
                    layout.buildDirectory.file('game/osclient.exe').get().asFile].find { it.exists() }
        if (game) {
            String rel = distDir.get().asFile.toPath().relativize(game.toPath()).toString()
            text = text + System.lineSeparator() + 'game=' + rel + System.lineSeparator()
            logger.lifecycle("  game=${rel}")
        }
        target.text = text

        // Say what actually landed in the file, not what we meant to put there -- the whole failure
        // above was a log line that looked right next to a file that was wrong.
        logger.lifecycle("wrote ${target}")
        text.readLines().findAll { it.startsWith('java=') }.each { logger.lifecycle("  ${it}") }
    }
}

// ---------------------------------------------------------------------------------------------------
// The two tasks you actually type
// ---------------------------------------------------------------------------------------------------

// The per-build offset files ride along beside the DLL: it loads offsets/client-<build>.json for
// whatever osclient.exe it finds itself in, and only asks the repository for one it does not have.
tasks.register('copyOffsets', Copy) {
    description = 'Put offsets/*.json next to the DLL.'
    from 'offsets'
    include '*.json'
    into distDir.map { it.dir('offsets') }
}

tasks.register('dist') {
    group = 'build'
    description = 'Build everything into build/dist, ready to run.'
    dependsOn 'jar', 'cmakeBuild', 'writeIni', 'copyOffsets'

    doLast {
        // CHECK THE FILES, NOT THE EXIT CODE. A CMake target-name collision once produced two copies of
        // the launcher and no DLL at all, and every tool in the chain reported success -- MSBuild built
        // both projects it was given, and Gradle saw a zero exit. The only thing that noticed was
        // looking in the directory. So: look in the directory.
        // A copy of the game is not a build output and MUST NOT live under build/, which every
        // clean deletes. Say so while the evidence is in front of whoever is reading the build log,
        // rather than at the moment the launcher cannot start. Warn, never fail: building with no
        // local copy of the game is perfectly legitimate.
        def gameHere = file('game/osclient.exe')
        def gameInBuild = layout.buildDirectory.file('game/osclient.exe').get().asFile
        if (gameInBuild.exists() && !gameHere.exists()) {
            logger.warn("WARNING: your copy of the game is under build/, at " + gameInBuild)
            logger.warn("Every clean build deletes build/, and that is how the only local copy of")
            logger.warn("client-240-6 -- the build offsets.hpp was measured against -- was lost on")
            logger.warn("2026-09-07. Move it to " + gameHere + " instead.")
            logger.warn("osclient.exe is gitignored anywhere in the tree, and writeIni points game=")
            logger.warn("at whichever of the two it finds.")
        }

        def required = ['0xClient.exe', '0xclient.dll', '0xclient.jar', '0xclient.ini']
        def missing = required.findAll { !distDir.get().file(it).asFile.exists() }
        if (missing) {
            throw new GradleException(
                    "\n\n  The build reported success but did not produce: ${missing.join(', ')}\n\n" +
                    "  Everything the launcher needs has to sit in\n    ${distDir.get().asFile}\n" +
                    "  Scroll up for the CMake or javac error that caused this.\n")
        }

        logger.lifecycle("\n  built -> ${distDir.get().asFile}")
        distDir.get().asFile.listFiles()?.sort { it.name }?.each { logger.lifecycle("    ${it.name}") }
    }
}

tasks.register('run', Exec) {
    group = 'application'
    description = 'Build everything, then open the launcher.'
    dependsOn 'dist'

    doFirst {
        def exe = distDir.get().file('0xClient.exe').asFile
        if (!exe.exists()) {
            throw new GradleException("0xClient.exe was not built. Look for the CMake error above this.")
        }
        logger.lifecycle("\n  Press '+ client' in the launcher to start, inject and embed the game, then log in.\n")
    }

    commandLine distDir.get().file('0xClient.exe').asFile.absolutePath
}

// `gradlew clean` should also remove the native build tree, which lives outside Gradle's knowledge.
clean {
    delete nativeBuildDir
}
