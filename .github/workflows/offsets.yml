# Keeps offsets/ current without anyone noticing Jagex updated the game.
#
# Every few hours: ask the CDN what build is in production. If there is no offsets/client-<build>.json
# for it yet, download the build, run Ghidra headless with tools/ghidra_scripts/DeriveOffsets.java,
# merge with the previous build's file (tools/update/update.py does all of that) and open a pull
# request with the result and the diff. The DLL fetches the merged file from the main branch on first
# start, so merging that PR is the release.
#
# Nothing here is a secret: the game binary is public, Ghidra is free, and the derivation prints its
# evidence. A maintainer still reads the pull request before merging -- its body is update.py's review
# summary: what was derived, what was carried and why that matters, what the DLL will refuse, and a
# REGRESSION section (also flagged in the title) when a rule that matched the previous build stopped
# matching. After merging, the first logged-in run writes a self-check report (client/selfcheck.hpp);
# `python tools/update/verify.py` on it turns what the running game confirmed into "verified".
name: offsets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      build:
        description: "Client build to derive (e.g. 241-3). Empty = current production build."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.2_build/ghidra_11.4.2_PUBLIC_20250826.zip
  GHIDRA_SHA256: 795a02076af16257bd6f3f4736c4fc152ce9ff1f95df35cd47e2adc086e037a6

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Which build is live, and do we have it?
        id: probe
        run: |
          set -e
          if [ -n "${{ github.event.inputs.build }}" ]; then
            build="${{ github.event.inputs.build }}"
          else
            build=$(python3 tools/update/fetch_client.py --version)
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ -f "offsets/client-$build.json" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "offsets/client-$build.json already exists; nothing to do"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Java 21 for Ghidra
        if: steps.probe.outputs.have == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pinned, and checked: the derivation rules read Ghidra's instruction text, so a new Ghidra is a
      # change to review like any other -- bump GHIDRA_URL and GHIDRA_SHA256 together, in a PR of their own.
      - name: Ghidra (pinned)
        if: steps.probe.outputs.have == 'false'
        id: ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-${{ env.GHIDRA_SHA256 }}

      - name: Ghidra download
        if: steps.probe.outputs.have == 'false' && steps.ghidra.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSL "$GHIDRA_URL" -o ghidra.zip
          echo "$GHIDRA_SHA256  ghidra.zip" | sha256sum -c -
          mkdir -p "$HOME/ghidra" && unzip -q ghidra.zip -d "$HOME/ghidra"

      - name: Ghidra home
        if: steps.probe.outputs.have == 'false'
        run: echo "GHIDRA_HOME=$(ls -d $HOME/ghidra/ghidra_*)" >> "$GITHUB_ENV"

      - name: Derive offsets
        if: steps.probe.outputs.have == 'false'
        id: derive
        run: |
          set -e
          python3 tools/update/update.py --build "${{ steps.probe.outputs.build }}" --summary summary.md 2> derive.log
          cat derive.log
          { echo; echo '<details><summary>derivation log</summary>'; echo; echo '```'; cat derive.log; echo '```'; echo '</details>'; } >> summary.md
          if grep -q '^### REGRESSION' summary.md; then echo "flag=[REGRESSION] " >> "$GITHUB_OUTPUT"; else echo "flag=" >> "$GITHUB_OUTPUT"; fi

      - name: Rebuild the wiki
        if: steps.probe.outputs.have == 'false'
        run: python3 tools/wiki/build_wiki.py

      - name: Open a pull request
        if: steps.probe.outputs.have == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: offsets/client-${{ steps.probe.outputs.build }}
          title: "${{ steps.derive.outputs.flag }}Offsets for client-${{ steps.probe.outputs.build }}"
          commit-message: "Offsets for client-${{ steps.probe.outputs.build }}"
          body-path: summary.md
          add-paths: |
            offsets/client-${{ steps.probe.outputs.build }}.json
            wiki/index.html
